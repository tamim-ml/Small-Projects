<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
        #output{
            color: #f37335;
            margin-left: 150px;
            font-size: 200px;
        }
        #just_id{
            color: #f37335;
            font-size: 50px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Triangle</h2>

        <form method="POST">

            <div class="input-group">
                <label for="a">Side A</label>
                <input type="number" id="a" name="a" step="any" required>
            </div>

            <div class="input-group">
                <label for="b">Side B</label>
                <input type="number" id="b" name="b" step="any" required>
            </div>

            <div class="input-group">
                <label for="c">Side C</label>
                <input type="number" id="c" name="c" step="any" required>
            </div>

            <button type="submit">Submit</button>

        </form>



    </div>
    <label id="just_id">{{title}} </label>
    <h1 id="output">{{areas}}</h1>
</body>
</html>
