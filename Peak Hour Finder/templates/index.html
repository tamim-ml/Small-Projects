<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Input Data</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
	<style>
		:root{
			--bg: #f4f7f5;
			--surface: #ffffff;
			--ink: #14231b;
			--muted: #5d6f64;
			--line: #d5dfd9;
			--accent: #1f9d5c;
			--accent-dark: #17794a;
			--accent-soft: rgba(31, 157, 92, .18);
		}
		@media (prefers-color-scheme: dark){
			:root{
				--bg: #0f1713;
				--surface: #17221c;
				--ink: #e8f1ec;
				--muted: #93a79b;
				--line: #2a3a31;
				--accent: #3ccf84;
				--accent-dark: #5fe0a0;
				--accent-soft: rgba(60, 207, 132, .22);
			}
		}
		*{ box-sizing: border-box; }
		html{ height: 100%; }
		body{
			margin: 0;
			min-height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 20px;
			padding: 24px;
			background-color: var(--bg);
			color: var(--ink);
			font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		.inputs{
			width: 100%;
			max-width: 440px;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 32px;
			box-shadow: 0 12px 32px rgba(20, 35, 27, .08);
		}
		form{
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		label{
			color: var(--ink);
			font-size: 15px;
			font-weight: 500;
			margin-top: 10px;
		}
		label:first-child{ margin-top: 0; }
		input{
			width: 100%;
			height: 46px;
			padding: 0 14px;
			border: 1.5px solid var(--line);
			border-radius: 8px;
			background: var(--bg);
			color: var(--ink);
			font: inherit;
			font-size: 16px;
			transition: border-color .15s, box-shadow .15s;
		}
		input::placeholder{ color: var(--muted); }
		input:hover{ border-color: var(--accent); }
		input:focus-visible{
			outline: none;
			border-color: var(--accent);
			box-shadow: 0 0 0 4px var(--accent-soft);
		}
		input[type="submit"]{
			margin-top: 22px;
			border: none;
			background: var(--accent);
			color: #fff;
			font-weight: 700;
			cursor: pointer;
			transition: background .15s, transform .1s;
		}
		input[type="submit"]:hover{ background: var(--accent-dark); }
		input[type="submit"]:active{ transform: translateY(1px); }
		input[type="submit"]:focus-visible{ box-shadow: 0 0 0 4px var(--accent-soft); }
		a{
			color: var(--accent-dark);
			font-weight: 500;
			text-decoration: none;
			border-bottom: 1.5px solid transparent;
			transition: border-color .15s;
		}
		a:hover, a:focus-visible{ border-bottom-color: currentColor; outline: none; }
	</style>
</head>
<body>
	<h1>Peak Hour Finder</h1>
	
	<div class="inputs">
		<form method="post">
			<label>Time: </label>
			<input type="number" name="times" placeholder="Enter The time" required max="24" min="1">
			<label>Mode: </label>
			<input type="number" name="mode" placeholder="Enter mode out of 5" required max="5" min="1">
			<input type="submit">
		</form>
	</div>
	<a href="/insights">See Insight</a>

</body>
</html>
